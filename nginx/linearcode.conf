server {
    server_name linearcode.io www.linearcode.io;
    
    root /var/www/linearcode;
    index index.html;
    
    # $uri/ resolves /research to /research/index.html; $uri.html keeps any
    # extensionless link working.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Markdown posts are fetched by /research/ and are also readable directly.
    # default_type (not a `types` block — that would REPLACE the inherited
    # mime.types map for the whole server and break css/js) so they render as
    # text instead of downloading. Posts and the manifest change on every
    # publish, so they stay out of the immutable cache bucket below.
    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.json$ {
        add_header Cache-Control "public, max-age=300";
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css text/markdown application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/linearcode.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/linearcode.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.linearcode.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = linearcode.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name linearcode.io www.linearcode.io;
    return 404; # managed by Certbot




}