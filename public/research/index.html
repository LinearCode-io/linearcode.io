<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research — LinearCode</title>
  <meta name="description"
    content="Where we publish write-ups from building Coco: on-device retrieval, OCR pipelines, encrypted peer-to-peer sync, and what it costs to keep everything local.">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="/">
        <span class="brand-tile"><img src="/logo.svg" alt=""></span>
        <span><span class="brand-name">LinearCode</span><span class="brand-sub hide-sm">/ Coco</span></span>
      </a>
      <nav class="topnav">
        <a href="/research/">Research</a>
        <a href="https://github.com/LinearCode-io" rel="noopener">GitHub</a>
        <a href="/#hiring">Hiring</a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round">
            <circle cx="10" cy="10" r="3.6" />
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4" />
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16.5 12.3A7 7 0 0 1 7.7 3.5a7 7 0 1 0 8.8 8.8Z" />
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section style="padding-bottom:32px">
      <div class="shell">
        <!--  This page is both the index (/research/) and the article reader
              (/research/?p=<slug>). Publishing an article means copying its
              Jekyll .md into research/posts/ and regenerating posts.json —
              `./scripts/build-index.py`, which deploy.sh runs for you. There
              is no per-article HTML file to write.  -->
        <div id="view" aria-live="polite">
          <div class="section-head">
            <h2>Research</h2>
          </div>
          <p class="footnote" style="margin-top:20px">Loading…</p>
        </div>

        <noscript>
          <div class="section-head">
            <h2>Research</h2>
            <p>
              Articles are published as Markdown and rendered in the browser, so this page needs
              JavaScript. The sources are readable as-is under
              <a href="/research/posts/">/research/posts/</a>.
            </p>
          </div>
        </noscript>
      </div>
    </section>
  </main>

  <footer>
    <div class="shell footer-inner">
      <span>© 2026 LinearCode · Private. Local. Ready when you are.</span>
      <nav class="footer-links">
        <a href="/">Home</a>
        <a href="/research/">Research</a>
        <a href="https://github.com/LinearCode-io" rel="noopener">GitHub</a>
        <a href="mailto:lc@linearcode.io">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="/md.js"></script>
  <script src="/research/research.js"></script>
  <script src="/demo.js"></script>
</body>

</html>
